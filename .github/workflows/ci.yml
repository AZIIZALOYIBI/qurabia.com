name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # NOTE: lint is non-blocking until the frontend lint cleanup lands; flip to
      # blocking (remove continue-on-error) once `npm run lint` is clean.
      - name: Lint (Biome)
        continue-on-error: true
        run: npm run lint
      - name: Test (Vitest)
        run: npx vitest run
      - name: Build
        run: npm run build

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.11.6
      # NOTE: ruff lint/format are non-blocking until the backend cleanup lands;
      # flip to blocking once `ruff check backend/` and `ruff format --check` pass.
      - name: Lint (Ruff)
        continue-on-error: true
        run: ruff check backend/
      - name: Format check (Ruff)
        continue-on-error: true
        run: ruff format --check backend/
      - name: Test (pytest)
        working-directory: backend
        run: python -m pytest tests/ -q

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t qurabia-backend:ci .
