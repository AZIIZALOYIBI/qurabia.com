# ======================================================
# فحص التبعيات الأمنية تلقائياً
# يعمل: كل أربعاء 07:00 UTC + عند تغيير ملفات التبعيات + يدوياً
# ======================================================
name: 🛡️ Dependency Security Check

on:
  schedule:
    # كل أربعاء الساعة 07:00 UTC
    - cron: '0 7 * * 3'
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ─── فحص تبعيات Node.js ─────────────────────────────
  npm-audit:
    name: 📦 فحص تبعيات npm
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
      report: ${{ steps.audit.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: تثبيت التبعيات
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: فحص الثغرات
        id: audit
        working-directory: frontend
        run: |
          set +e
          OUTPUT=$(npm audit --json 2>/dev/null)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            VULN_COUNT=$(echo "$OUTPUT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          meta = data.get('metadata', {})
          vulns = meta.get('vulnerabilities', {})
          total = sum(vulns.values()) if isinstance(vulns, dict) else 0
          print(total)
          " 2>/dev/null || echo "غير محدد")
            echo "report=npm audit: ${VULN_COUNT} ثغرة محتملة" >> $GITHUB_OUTPUT
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "report=npm: لا توجد ثغرات" >> $GITHUB_OUTPUT
          fi

          echo "$OUTPUT" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              vulns = data.get('vulnerabilities', {})
              if vulns:
                  print(f'الثغرات المكتشفة: {len(vulns)}')
                  for name, info in list(vulns.items())[:10]:
                      sev = info.get('severity', 'unknown')
                      print(f'  - {name}: {sev}')
              else:
                  print('لا توجد ثغرات!')
          except:
              print('لم يمكن تحليل التقرير')
          " || true

      - name: حفظ تقرير npm audit
        run: npm audit --json 2>/dev/null > /tmp/npm-audit.json || true
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}
          path: /tmp/npm-audit.json
          retention-days: 30

  # ─── فحص تبعيات Python ──────────────────────────────
  pip-audit:
    name: 🐍 فحص تبعيات Python
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
      report: ${{ steps.audit.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: تثبيت pip-audit
        run: pip install pip-audit

      - name: تثبيت تبعيات الخلفية
        working-directory: backend
        run: pip install -r requirements.txt

      - name: فحص الثغرات
        id: audit
        run: |
          set +e
          pip-audit -r backend/requirements.txt --format=json -o /tmp/pip-audit.json 2>/dev/null
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            VULN_COUNT=$(python3 -c "
          import json
          try:
              with open('/tmp/pip-audit.json') as f:
                  data = json.load(f)
              vulns = [v for pkg in data for v in pkg.get('vulns', [])]
              print(len(vulns))
          except:
              print('غير محدد')
          ")
            echo "report=pip-audit: ${VULN_COUNT} ثغرة محتملة" >> $GITHUB_OUTPUT
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "report=pip: لا توجد ثغرات" >> $GITHUB_OUTPUT
          fi

          python3 -c "
          import json
          try:
              with open('/tmp/pip-audit.json') as f:
                  data = json.load(f)
              vulns = [(pkg['name'], v['id'], v['description'][:80])
                       for pkg in data for v in pkg.get('vulns', [])]
              if vulns:
                  print(f'الثغرات: {len(vulns)}')
                  for name, vid, desc in vulns[:10]:
                      print(f'  - {name} [{vid}]: {desc}')
              else:
                  print('لا توجد ثغرات!')
          except Exception as e:
              print(f'تعذر تحليل التقرير: {e}')
          " || true

      - uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ github.run_id }}
          path: /tmp/pip-audit.json
          retention-days: 30

  # ─── تقرير الثغرات ───────────────────────────────────
  report:
    name: 📋 تقرير الثغرات
    runs-on: ubuntu-latest
    needs: [npm-audit, pip-audit]
    if: always()
    steps:
      - name: إنشاء issue عند وجود ثغرات
        if: |
          needs.npm-audit.outputs.has_vulnerabilities == 'true' ||
          needs.pip-audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('ar-SA', {
              timeZone: 'Asia/Riyadh',
              year: 'numeric',
              month: 'long',
              day: 'numeric',
            });

            const npmStatus = '${{ needs.npm-audit.outputs.has_vulnerabilities }}' === 'true'
              ? `❌ ${{ needs.npm-audit.outputs.report }}`
              : `✅ لا توجد ثغرات في npm`;

            const pipStatus = '${{ needs.pip-audit.outputs.has_vulnerabilities }}' === 'true'
              ? `❌ ${{ needs.pip-audit.outputs.report }}`
              : `✅ لا توجد ثغرات في Python`;

            const body = `## 🛡️ تقرير الثغرات الأمنية في التبعيات — ${date}

            | المجال | الحالة |
            |--------|--------|
            | 📦 npm (Frontend) | ${npmStatus} |
            | 🐍 pip (Backend) | ${pipStatus} |

            ## 🔧 خطوات الإصلاح

            ### لإصلاح ثغرات npm:
            \`\`\`bash
            cd frontend
            npm audit fix
            # أو للإصلاح الجذري:
            npm audit fix --force
            \`\`\`

            ### لإصلاح ثغرات Python:
            \`\`\`bash
            cd backend
            pip-audit -r requirements.txt --fix
            # ثم حدّث requirements.txt:
            pip freeze > requirements.txt
            \`\`\`

            > **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🛡️ ثغرات أمنية في التبعيات — ${date}`,
              body,
              labels: ['security', 'dependencies', 'automated'],
            });

            core.setFailed('تم اكتشاف ثغرات أمنية في التبعيات!');

      - name: ملخص النتائج
        uses: actions/github-script@v7
        with:
          script: |
            const npmOk = '${{ needs.npm-audit.outputs.has_vulnerabilities }}' !== 'true';
            const pipOk = '${{ needs.pip-audit.outputs.has_vulnerabilities }}' !== 'true';

            core.summary
              .addHeading('🛡️ فحص الثغرات الأمنية')
              .addTable([
                [{data: 'المجال', header: true}, {data: 'الحالة', header: true}],
                ['📦 npm', npmOk ? '✅ آمن' : '❌ توجد ثغرات'],
                ['🐍 pip', pipOk ? '✅ آمن' : '❌ توجد ثغرات'],
              ])
              .write();
