name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_GROK_KEY: ${{ secrets.VITE_GROK_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to gh-pages branch
        run: |
          if [ ! -d frontend/dist ]; then
            echo "Build output directory frontend/dist not found" >&2
            exit 1
          fi
          cd frontend/dist
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add .
          git commit -m "deploy: ${{ github.sha }}"
          git push --force origin HEAD:gh-pages

  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test (post-deploy)
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://qurabia.com"

          echo "Waiting briefly for Pages/CDN propagation..."
          sleep 30

          check() {
            local path="$1"
            local must_contain="${2:-}"
            echo "GET ${BASE_URL}${path}"
            local code
            code="$(curl -sL -o /tmp/resp.html -w "%{http_code}" "${BASE_URL}${path}")"
            if [ "${code}" != "200" ]; then
              echo "Unexpected status for ${path}: ${code}"
              head -n 30 /tmp/resp.html || true
              exit 1
            fi
            if [ -n "${must_contain}" ]; then
              grep -q "${must_contain}" /tmp/resp.html
            fi
          }

          check "/" "QURABIA"
          check "/landing.html" "QURABIA"
          check "/qurabia.html" "لوحة الخوارزميات"
          check "/QuantumOS.html" "QuantumOS"
          check "/sitemap.xml" "qurabia.com"
          check "/robots.txt" "User-agent"

      - name: Optional backend health check
        if: ${{ secrets.VITE_API_BASE_URL != '' }}
        shell: bash
        env:
          API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          echo "Checking backend health at ${API_BASE}/health"
          code="$(curl -s -o /dev/null -w "%{http_code}" "${API_BASE}/health")"
          if [ "${code}" != "200" ]; then
            echo "Backend health check failed with status ${code}"
            exit 1
          fi
