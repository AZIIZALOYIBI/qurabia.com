name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Secret scan (tracked files)
        shell: bash
        run: |
          python - << 'PY'
          import os
          import re
          import subprocess
          import sys

          def git_ls_files() -> list[str]:
            out = subprocess.check_output(["git", "ls-files"], text=True)
            return [line.strip() for line in out.splitlines() if line.strip()]

          forbidden_tracked = []
          for p in git_ls_files():
            base = os.path.basename(p)
            if base == ".env":
              forbidden_tracked.append(p)
            if base.startswith(".env.") and base != ".env.example":
              forbidden_tracked.append(p)

          if forbidden_tracked:
            print("Found forbidden tracked env files:")
            for p in forbidden_tracked:
              print(f"  - {p}")
            sys.exit(1)

          patterns: list[tuple[str, re.Pattern[str]]] = [
            ("google_api_key", re.compile(r"AIza[0-9A-Za-z\\-_]{20,}")),
            ("openai_like_key", re.compile(r"\\bsk-[0-9A-Za-z]{20,}\\b")),
            ("github_pat", re.compile(r"\\bgithub_pat_[0-9A-Za-z_]{20,}\\b")),
            ("github_token", re.compile(r"\\bghp_[0-9A-Za-z]{20,}\\b")),
            ("private_key_block", re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|PRIVATE) KEY-----|BEGIN PRIVATE KEY")),
          ]

          flagged: list[tuple[str, str]] = []
          for p in git_ls_files():
            if p.startswith(".git/"):
              continue
            try:
              b = open(p, "rb").read()
            except Exception:
              continue
            if b"\x00" in b:
              continue
            if len(b) > 2_000_000:
              continue
            try:
              s = b.decode("utf-8", errors="ignore")
            except Exception:
              continue
            for name, rx in patterns:
              if rx.search(s):
                flagged.append((p, name))

          if flagged:
            print("Potential secrets detected (pattern-based). Remove them from tracked files:")
            for p, name in flagged:
              print(f"  - {p}  [{name}]")
            sys.exit(1)

          print("Secret scan OK")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_GROK_KEY: ${{ secrets.VITE_GROK_KEY }}
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
