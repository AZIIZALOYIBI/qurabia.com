# تنظيف الفروع المدمجة تلقائياً
# يعمل عند دمج Pull Request أو يدوياً
name: 🧹 Cleanup Merged Branches

on:
  # تشغيل تلقائي عند إغلاق PR (دمج أو إغلاق)
  pull_request:
    types: [closed]
  # تشغيل يدوي
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'معاينة فقط بدون حذف'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # عند PR: يعمل فقط إذا تم الدمج
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: 🧹 حذف الفرع المدمج
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protected_branches = ['main', 'gh-pages'];

            if (protected_branches.includes(branch)) {
              console.log(`⚠️ الفرع ${branch} محمي، لن يتم حذفه`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`✅ تم حذف الفرع: ${branch}`);
            } catch (error) {
              console.log(`ℹ️ لم يتم حذف الفرع ${branch}: ${error.message}`);
            }

      - name: 🧹 حذف جميع الفروع المدمجة
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const dry_run = '${{ inputs.dry_run }}' === 'true';
            const protected_branches = ['main', 'gh-pages'];

            // الحصول على جميع الفروع
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            console.log(`📋 إجمالي الفروع: ${branches.length}`);

            // الحصول على SHA الخاص بـ main
            const mainBranch = branches.find(b => b.name === 'main');
            if (!mainBranch) {
              console.log('❌ لم يتم العثور على فرع main');
              return;
            }

            let deleted = 0;
            let skipped = 0;

            for (const branch of branches) {
              if (protected_branches.includes(branch.name)) {
                console.log(`🔒 محمي: ${branch.name}`);
                skipped++;
                continue;
              }

              // التحقق مما إذا كان الفرع مدمجاً
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: 'main',
                  head: branch.name,
                });

                if (comparison.data.status === 'behind' || comparison.data.status === 'identical') {
                  if (dry_run) {
                    console.log(`👁️ [معاينة] سيتم حذف: ${branch.name} (${comparison.data.status})`);
                  } else {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `heads/${branch.name}`,
                    });
                    console.log(`✅ تم حذف: ${branch.name}`);
                  }
                  deleted++;
                } else {
                  console.log(`⏭️ غير مدمج: ${branch.name} (ahead by ${comparison.data.ahead_by} commits)`);
                  skipped++;
                }
              } catch (error) {
                console.log(`⚠️ خطأ في ${branch.name}: ${error.message}`);
                skipped++;
              }
            }

            console.log('');
            console.log('──────────────────────────────────────────');
            console.log(`${dry_run ? '👁️ معاينة' : '✅ تم الحذف'}: ${deleted} فرع`);
            console.log(`⏭️ تم تخطي: ${skipped} فرع`);
            console.log('──────────────────────────────────────────');
