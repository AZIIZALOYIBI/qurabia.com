# QURABIA — بيئة تطوير محلية
# استخدام: docker compose up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      APP_ENV: development
      PORT: "10000"
      RATE_LIMIT_DB_PATH: /tmp/rate_limit.db
      LEARNING_DB_PATH: /tmp/learning.db
      MEMORY_STORE_PATH: /tmp/memory_store.json
      KEM_MASTER_SEED: dev-seed-not-for-production
      DSA_SIGNING_KEY: dev-key-not-for-production
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: node:22-slim
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:10000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
