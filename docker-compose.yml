# QURABIA — بيئة تطوير محلية
# استخدام: docker compose up

services:
  redis:
    image: redis:7-alpine
    container_name: qurabia-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qurabia-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qurabia-celery-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      APP_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - qurabia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qurabia-backend
    ports:
      - "10000:10000"
    environment:
      APP_ENV: development
      PORT: "10000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RATE_LIMIT_DB_PATH: /tmp/rate_limit.db
      LEARNING_DB_PATH: /tmp/learning.db
      MEMORY_STORE_PATH: /tmp/memory_store.json
      KEM_MASTER_SEED: dev-seed-not-for-production
      DSA_SIGNING_KEY: dev-key-not-for-production
      ENABLE_RUNTIME_SECRET_CONFIG: "1"
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    volumes:
      - ./backend:/app
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - qurabia-network

  frontend:
    image: node:22-slim
    container_name: qurabia-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:10000
      VITE_ENV: development
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qurabia-network
    stdin_open: true
    tty: true

networks:
  qurabia-network:
    driver: bridge

volumes:
  frontend_node_modules:
  redis_data:
