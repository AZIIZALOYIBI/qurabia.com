services:
  - type: web
    name: qurabia-backend
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: "production"
      - key: KEM_MASTER_SEED
        sync: false
      - key: DSA_SIGNING_KEY
        sync: false
