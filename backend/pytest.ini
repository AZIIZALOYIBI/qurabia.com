[pytest]
# Pytest Configuration for QURABIA Backend
# ========================================

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Test paths
testpaths = tests

# Add current directory to Python path
pythonpath = .

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    security: Security-related tests (authentication, encryption, etc.)
    performance: Performance and benchmark tests
    slow: Tests that take more than 1 second to run
    quantum: Quantum computing related tests
    arabic: Arabic language processing tests
    api: API endpoint tests
    database: Database-related tests
    crypto: Cryptography tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test types
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config
    --strict-config
    # Show warnings
    -W default
    # Coverage options (when running with --cov)
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # Disable cacheprovider for CI
    # -p no:cacheprovider
    # Short traceback format for cleaner output
    --tb=short
    # Show durations of slowest 10 tests
    --durations=10

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*
    */dist/*
    */build/*
    setup.py

[coverage:report]
# Coverage thresholds
fail_under = 70
precision = 2
show_missing = True
skip_covered = False
skip_empty = True

# Ignore specific lines in coverage
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    if self\.debug
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if 0:
    if False:
    if __name__ == .__main__.:
    # Type checking code
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    # Abstract methods
    @(abc\.)?abstractmethod
    # Protocols
    @(typing\.)?runtime_checkable
    # Deprecated code
    @deprecated

[coverage:html]
directory = htmlcov

# Logging configuration for tests
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
# Requires pytest-timeout plugin
# timeout = 300
# timeout_method = thread

# Asyncio configuration
# Requires pytest-asyncio plugin
asyncio_mode = auto

# Warning filters
filterwarnings =
    # Treat warnings as errors (strict mode)
    # error
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Allow specific warnings
    default::UserWarning

# Console output styling
console_output_style = progress

# Collect only from tests directory
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .cache
    .pytest_cache
    htmlcov
    .coverage
    node_modules
    venv
    .venv

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Required plugins (will fail if not installed)
required_plugins =
    pytest-asyncio>=0.25.0

# xfail strict mode
xfail_strict = true

# Performance
# Maximum number of concurrent workers for pytest-xdist
# -n auto
