[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name            = "phantom-sandbox"
version         = "3.0.0"
description     = "المحاكاة الشبحية — نظام اختبار ما قبل الإنتاج بسبع طبقات وعي"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12"
keywords        = ["testing", "docker", "chaos-engineering", "sandbox", "ci-cd", "AUTDIE"]
authors         = [
    { name = "Abdulaziz bin Sultan Al-Otaibi" }
]

dependencies = [
    "httpx[http2]>=0.27",
    "anyio>=4.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
phantom-sandbox = "phantom_sandbox.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
log_cli      = true
log_cli_level = "INFO"
addopts      = "--tb=short --strict-markers"

[tool.ruff]
target-version = "py312"
line-length    = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["phantom_sandbox"]
omit   = ["*/__main__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 80
