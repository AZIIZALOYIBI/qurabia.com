# ══════════════════════════════════════
# NETLIFY CONFIG — qurabia.com
# ══════════════════════════════════════

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# ── Security headers for all routes ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # connect-src includes all external APIs the app calls at runtime
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://api.x.ai https://api.qurabia.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Cache-Control             = "public, max-age=3600"

# ── Hashed assets — immutable, cache for 1 year ──────────────────────────────
# Vite content-hashes every file under /assets/*, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML entry points — always revalidate ────────────────────────────────────
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/qurabia.html"
  [headers.values]
    Cache-Control = "no-cache"

# ── Service worker — must never be cached ────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type  = "application/javascript; charset=utf-8"

# ── Web app manifest — short-lived cache ─────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json; charset=utf-8"

