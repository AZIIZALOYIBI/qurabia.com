<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- CSP meta tag provides security headers for the site.
         It is the authoritative policy for GitHub Pages deployment. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.qurabia.com; frame-src 'self'; upgrade-insecure-requests"
    />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Primary meta -->
    <title>QURABIA — القوة الكمية العربية</title>
    <meta name="description" content="منصة QURABIA للذكاء الاصطناعي والحوسبة الكمية - الجيل القادم من التكنولوجيا العربية" />
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.qurabia.com/" />
    <meta property="og:title"       content="QURABIA — القوة الكمية العربية" />
    <meta property="og:description" content="منصة عربية مبتكرة تجمع الذكاء الاصطناعي والحوسبة الكمية — الجيل القادم من التكنولوجيا." />
    <meta property="og:image"       content="https://www.qurabia.com/favicon.svg" />
    <meta property="og:locale"      content="ar_AR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="QURABIA — القوة الكمية العربية" />
    <meta name="twitter:description" content="منصة عربية مبتكرة تجمع الذكاء الاصطناعي والحوسبة الكمية." />
    <meta name="twitter:image"       content="https://www.qurabia.com/favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
