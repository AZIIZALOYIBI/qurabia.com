<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QURABIA</title>
    <script>
      const requestedPath = window.location.pathname.startsWith('/qurabia.com')
        ? window.location.pathname.replace(/^\/qurabia\.com/, '') || '/'
        : window.location.pathname || '/';

      const redirectTarget =
        './?redirect=' +
        encodeURIComponent(requestedPath + window.location.search + window.location.hash);

      window.location.replace(redirectTarget);
    </script>
  </head>
  <body></body>
</html>
