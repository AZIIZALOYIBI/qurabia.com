# Ruff configuration for QURABIA backend
target-version = "py311"
line-length = 120

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "S101",   # assert usage (needed in tests)
  "S603",   # subprocess calls (needed in tools)
  "S607",   # partial executable path
  "B008",   # function calls in default args (FastAPI uses this)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"tools/**/*.py" = ["S603", "S607"]

[format]
quote-style = "double"
indent-style = "space"
